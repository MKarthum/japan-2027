name: Public content checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-public-content.mjs
      - run: node scripts/check-data-integrity.mjs
      - run: node scripts/check-content-style.mjs
